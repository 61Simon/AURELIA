<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Received | AURELIA</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-base: #0a0a0a;
            --gold: #C6A87C;
            --gold-hover: #DEC29A;
            --text-main: #F5F5F5;
            --text-muted: #999999;
            --font-main: 'Inter', sans-serif;
            --transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-main);
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            padding: 20px;
        }

        /* Background effects */
        .bg-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(198,168,124,0.08) 0%, var(--bg-base) 70%);
            z-index: 0;
        }

        .bg-lines {
            position: absolute;
            top: 0; bottom: 0; left: 15%; width: 70%;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 0;
            opacity: 0.2;
        }

        .bg-lines span {
            width: 1px;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.2), transparent);
        }

        /* Content Container - Flexbox guarantees perfect vertical stacking */
        .content {
            position: relative;
            z-index: 10;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeUp 1s var(--transition) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        /* Logo */
        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            margin-bottom: 30px;
            text-decoration: none;
        }
        .logo-icon-svg {
            height: 32px;
            width: auto;
            fill: var(--text-main);
            margin-bottom: 4px;
        }
        .logo-main {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 0.3em;
            color: var(--text-main);
            line-height: 1;
        }
        .logo-sub {
            font-size: 0.5rem;
            letter-spacing: 0.6em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Icon */
        .success-icon {
            font-size: 4rem;
            color: var(--gold);
            margin-bottom: 30px;
            animation: scaleIn 0.8s var(--transition) forwards;
            animation-delay: 0.3s;
            opacity: 0;
            transform: scale(0.8);
        }

        /* Typography */
        .title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .title span {
            color: var(--gold);
        }

        .subtitle {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 20px;
            letter-spacing: 0.05em;
        }

        .desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 40px;
            max-width: 480px;
        }

        /* Button */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 36px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            border-radius: 30px;
            transition: var(--transition);
            border: 1px solid var(--gold);
            background: var(--gold);
            color: var(--bg-base);
            text-decoration: none;
        }

        .btn:hover {
            background: transparent;
            color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(198,168,124,0.15);
        }

        /* Animations */
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Mobile adjustments */
        @media (max-width: 576px) {
            .success-icon { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>
    <div class="bg-lines">
        <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="content">
        <a href="/" class="logo">
            <svg class="logo-icon-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 16L12 2L22 16H2Z" fill="white"/>
                <path d="M6 16L12 7L18 16H6Z" fill="#0a0a0a"/>
            </svg>
            <div class="logo-main">AURELIA</div>
            <div class="logo-sub">DETAILING</div>
        </a>

        <i class="fa-solid fa-circle-check success-icon"></i>
        
        <h1 class="title">THANK <span>YOU.</span></h1>
        <div class="subtitle">Your request has been received.</div>
        
        <p class="desc">We appreciate your interest in AURELIA. Our team will review your vehicle details and contact you shortly to confirm your appointment and discuss the next steps.</p>

        <a href="/" class="btn">RETURN TO HOME <i class="fa-solid fa-arrow-right"></i></a>
    </div>

</body>
</html>
